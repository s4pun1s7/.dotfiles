unbind C-b
set-option -g prefix M-q
set-option -sg escape-time 10
set-option -g allow-rename off
#set-option -g default-terminal "screen-256color"
set-option -g focus-events on

bind-key M-q send-prefix

unbind '"'
unbind %
unbind n
unbind f

bind r source-file ~/.config/tmux/tmux.conf
bind h split-window -h
bind v split-window -v
bind x kill-pane
bind n switch-client -n
bind f resize-pane -Z

# Pane keys differ per machine: dwm's MODKEY is Super, so Alt is free on Linux,
# but on the Mac skhd/yabai own Alt (config/skhd/skhdrc) and we fall back to Ctrl.
if-shell '[ "$(uname)" = Linux ]' {
    # move between panes: Alt+hjkl, no prefix
    bind -n M-h select-pane -L
    bind -n M-l select-pane -R
    bind -n M-k select-pane -U
    bind -n M-j select-pane -D

    # resize panes: prefix (Alt+q) then Alt+hjkl
    bind-key -r -T prefix   M-k            resize-pane -U 5
    bind-key -r -T prefix   M-j            resize-pane -D 5
    bind-key -r -T prefix   M-h            resize-pane -L 5
    bind-key -r -T prefix   M-l            resize-pane -R 5
} {
    # move between panes: Ctrl+hjkl, no prefix
    bind -n C-h select-pane -L
    bind -n C-l select-pane -R
    bind -n C-k select-pane -U
    bind -n C-j select-pane -D

    # resize panes: prefix (Alt+q) then Shift+HJKL
    bind-key -r -T prefix   K              resize-pane -U 5
    bind-key -r -T prefix   J              resize-pane -D 5
    bind-key -r -T prefix   H              resize-pane -L 5
    bind-key -r -T prefix   L              resize-pane -R 5
}

bind-key -T copy-mode-vi	K	send-keys -X halfpage-up
bind-key -T copy-mode-vi	J	send-keys -X halfpage-down



######################
### DESIGN CHANGES ###			# STOLEN
######################

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

#  modes
setw -g mode-keys vi
setw -g clock-mode-colour colour6
setw -g mode-style 'fg=#14171E bg=#88C0D0 bold'

# panes - same borders as the dwm window borders
set -g pane-border-style 'fg=#1C212B'
set -g pane-active-border-style 'fg=#88C0D0'

# statusbar - Nord palette, matching dwm's bar (see THEME.md)
set -g status-position top
set -g status-justify left
set -g status-style 'bg=#14171E fg=#C8D0DC'
set -g status-left ''
set -g status-right '#[fg=#14171E,bg=#88C0D0,bold] #(~/.config/tmux/bat.sh)%d.%m.%y | %H:%M:%S '
set -g status-right-length 100
set -g status-left-length 20

setw -g window-status-current-format ' #I#[fg=#C8D0DC]:#[fg=#88C0D0]#W#[fg=#88C0D0]#F '
setw -g window-status-format ' #I#[fg=#2A303C]:#[fg=#C8D0DC]#W#[fg=#81A1C1]#F '

setw -g window-status-bell-style 'fg=#BF616A bold'

# messages
set -g message-style 'fg=#14171E bg=#EBCB8B bold'

# Everything above is the Nord fallback. If pywal has run, this re-sets the
# colour-bearing options from the current wallpaper; -q keeps quiet on the Mac
# and before the first run. See scripts/setwallpaper.sh.
source-file -q ~/.cache/wal/colors-tmux.conf

