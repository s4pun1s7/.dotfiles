# Generated by pywal from the current wallpaper -- do not edit.
# Rendered to ~/.cache/wal/colors-dunst.conf. dunst has no include directive,
# so scripts/setwallpaper.sh links it in as ~/.config/dunst/dunstrc.d/50-wal.conf;
# drop-ins are read after dunstrc and override matching keys (dunst >= 1.7).

[global]
    frame_color = "{color4}"
    separator_color = frame

[urgency_low]
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "{color0}"

[urgency_normal]
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "{color4}"

[urgency_critical]
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "{color1}"
