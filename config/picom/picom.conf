# Lightweight picom for old Mac Pro dual Pitcairn GPUs
shadow = false;
fading = false;
backend = "xrender";
vsync = true;

# Let a fullscreen window take over the screen directly instead of being
# composited. picom defaults this to false, which silently costs every
# fullscreen game a frame of latency and pins it to the vsync cap.
# Once this is on, the backend above stops mattering for games - they bypass
# picom entirely - so xrender stays fine for the desktop.
unredir-if-possible = true;
use-damage = true;
detect-transient = true;
corner-radius = 0;
