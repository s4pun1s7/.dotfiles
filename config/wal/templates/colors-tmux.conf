# Generated by pywal from the current wallpaper -- do not edit.
# Rendered to ~/.cache/wal/colors-tmux.conf and sourced at the end of the
# DESIGN block in config/tmux/tmux.conf, so it overrides the Nord defaults
# there. Absent (Mac, or before the first `wal` run) the defaults stand.

setw -g mode-style 'fg={background} bg={color4} bold'

# panes - same borders as the dwm window borders
set -g pane-border-style 'fg={color0}'
set -g pane-active-border-style 'fg={color4}'

set -g status-style 'bg={background} fg={foreground}'
set -g status-right '#[fg={background},bg={color4},bold] #(~/.config/tmux/bat.sh)%d.%m.%y | %H:%M:%S '

setw -g window-status-current-format ' #I#[fg={foreground}]:#[fg={color4}]#W#[fg={color4}]#F '
setw -g window-status-format ' #I#[fg={color8}]:#[fg={foreground}]#W#[fg={color12}]#F '

setw -g window-status-bell-style 'fg={color1} bold'

set -g message-style 'fg={background} bg={color3} bold'
