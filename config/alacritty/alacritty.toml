[font]
normal = { family = "JetBrains Mono", style = "Regular" }
size = 11.0

[colors.primary]
background = "#14171E"
foreground = "#C8D0DC"

[colors.normal]
black = "#1C212B"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#88C0D0"
white = "#E5E9F0"

[colors.bright]
black = "#2A303C"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#8FBCBB"
white = "#D8DEE9"

[colors.cursor]
text = "#14171E"
cursor = "#C8D0DC"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
