# Imports load in order and the importing file loads LAST, so colours must not
# live in this file or they would beat the imports. Nord is the fallback;
# pywal's wallpaper-derived palette is imported after it and wins when present.
# Missing imports are skipped silently. See scripts/setwallpaper.sh.
general.import = [
    "colors-nord.toml",
    "~/.cache/wal/colors-alacritty.toml",
]

[font]
normal = { family = "JetBrains Mono", style = "Regular" }
size = 11.0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
